name: Release zip
# Push a tag like v2.0.0 and this builds dist/tab-stash-2.0.0.zip and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./release.sh "$V"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
